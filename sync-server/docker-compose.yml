services:
  sync-server:
    build: .
    container_name: yjs-sync-server
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - PORT=1234
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1234"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sync-network

networks:
  sync-network:
    driver: bridge
