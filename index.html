<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Collaborative Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #header { background: #2c3e50; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    #room-info { display: flex; gap: 1rem; align-items: center; }
    #status { padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.9rem; }
    #status.connected { background: #27ae60; }
    #status.disconnected { background: #e74c3c; }
    #main { flex: 1; display: flex; overflow: hidden; }
    #editor-container { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
    #editor { flex: 1; overflow: auto; }
    #chat-container { flex: 1; display: flex; flex-direction: column; background: #f5f5f5; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 1rem; }
    .message { margin-bottom: 0.5rem; padding: 0.5rem; background: white; border-radius: 4px; }
    .message .author { font-weight: bold; color: #3498db; font-size: 0.9rem; }
    .message .text { margin-top: 0.25rem; }
    #chat-input-container { padding: 1rem; background: white; border-top: 1px solid #ddd; }
    #chat-input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
    input[type="text"] { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 0.5rem 1rem; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>
  <div id="header">
    <h1>P2P Collaborative Editor</h1>
    <div id="room-info">
      <div>
        <label>Room: </label>
        <input type="text" id="room-input" placeholder="room-name" value="default-room">
        <button id="join-btn">Join</button>
      </div>
      <div id="status" class="disconnected">Disconnected</div>
      <div id="peers">Peers: 0</div>
    </div>
  </div>
  <div id="main">
    <div id="editor-container">
      <div id="editor"></div>
    </div>
    <div id="chat-container">
      <div id="chat-messages"></div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type a message...">
      </div>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
