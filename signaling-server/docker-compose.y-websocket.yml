version: '3.8'

services:
  y-websocket-server:
    build:
      context: .
      dockerfile: Dockerfile.y-websocket
    container_name: y-websocket-signaling
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
    networks:
      - webrtc-network

networks:
  webrtc-network:
    driver: bridge
